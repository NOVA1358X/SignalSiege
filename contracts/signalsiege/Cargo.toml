[package]
name = "signalsiege"
version = "0.1.0"
edition = "2021"
authors = ["SignalSiege Team"]
description = "On-Chain Circuit War - A turn-based strategy game on Linera"

[dependencies]
linera-sdk = "=0.15.8"
async-graphql = { version = "=7.0.17", default-features = false }
async-graphql-value = "=7.0.17"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
linera-sdk = { version = "=0.15.8", features = ["test"] }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "signalsiege_contract"
path = "src/contract.rs"

[[bin]]
name = "signalsiege_service"
path = "src/service.rs"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
